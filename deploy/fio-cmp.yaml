apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kbench-pvc-1
spec:
  volumeMode: Filesystem
  #volumeMode: Block
  #storageClassName: longhorn  # replace with your storage class
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 31Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kbench-pvc-2
spec:
  volumeMode: Filesystem
  #volumeMode: Block
  storageClassName: longhorn  # replace with your storage class
  #storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 31Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kbench
spec:
  template:
    metadata:
      labels:
        kbench: fio
    spec:
      containers:
      - name: kbench
        image: longhornio/kbench:main-head
        imagePullPolicy: Always
        env:
#        - name: MODE
#          value: "quick" # for debugging
#        - name: MODE
#          value: "random-read-iops"
#        - name: MODE
#          value: "sequential-read-bandwidth"
#        - name: MODE
#          value: "random-read-latency"
#        - name: MODE
#          value: "random-write-iops"
#        - name: MODE
#          value: "sequential-write-bandwidth"
#        - name: MODE
#          value: "random-write-latency"
        - name: MODE
          value: "full" # run all tests
        - name: FIRST_VOL_NAME
          value: Local-Path
        - name: FIRST_VOL_FILE
          value: "/volume1/test"
        - name: SECOND_VOL_NAME
          value: Longhorn
        - name: SECOND_VOL_FILE
          value: "/volume2/test"
        - name: SIZE
          value: "30G" # must be smaller or match the PVC size
        - name: CPU_IDLE_PROF
          value: "disabled" # must be "enabled" or "disabled"
        # Per-category workload parameters. Changing these makes the
        # results non-comparable with the kbench defaults.
        - name: IOPS_BS         # default 4K   (fio/iops-include.fio)
          value: "4K"
        - name: IOPS_IODEPTH    # default 128
          value: "128"
        - name: IOPS_NUMJOBS    # default 8
          value: "8"
        - name: BW_BS           # default 128K (fio/bandwidth-include.fio)
          value: "128K"
        - name: BW_IODEPTH      # default 16
          value: "16"
        - name: BW_NUMJOBS      # default 4
          value: "4"
        - name: LAT_BS          # default 4K   (fio/lat-include.fio)
          value: "4K"
        - name: LAT_IODEPTH     # default 1    (must stay 1 for meaningful latency)
          value: "1"
        - name: LAT_NUMJOBS     # default 1    (must stay 1 for meaningful latency)
          value: "1"
        volumeMounts:
        - name: vol1
          mountPath: /volume1/
        - name: vol2
          mountPath: /volume2/
        - mountPath: /temp
          name: temp-storage
        command: ["bash", "/fio/cmp_run.sh"]
        #volumeDevices:
        #- name: vol1
        #  devicePath: /volume1/test
        #- name: vol2
        #  devicePath: /volume2/test
      restartPolicy: Never
      volumes:
      - name: vol1
        persistentVolumeClaim:
          claimName: kbench-pvc-1
      - name: vol2
        persistentVolumeClaim:
          claimName: kbench-pvc-2
      - name: temp-storage
        emptyDir: {}
  backoffLimit: 0
